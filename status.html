<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Parking Reminder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-button {
            width: 100%;
            padding: 25px;
            font-size: 1.3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .vacation-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
        }

        .vacation-label {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #f39c12;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .vacation-status {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .status-button {
                font-size: 1.1rem;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Parking Reminder</h1>

        <div class="card">
            <form method="POST" action="/status">
                <button type="submit" class="status-button">
                    📍 Where Do I Park?
                </button>
            </form>
        </div>

        <div class="card">
            <div class="vacation-toggle">
                <label class="vacation-label" for="vacationToggle">
                    🏖️ Vacation Mode
                </label>
                <label class="toggle-switch">
                    <input type="checkbox" id="vacationToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="vacation-status" id="vacationStatus">
                Loading...
            </div>
        </div>

        <div class="footer">
            v2.0.2 • Add to Home Screen for quick access
        </div>
    </div>

    <script>
        // Load vacation mode status on page load
        async function loadVacationStatus() {
            try {
                const response = await fetch('/vacation/status');
                const data = await response.json();
                const toggle = document.getElementById('vacationToggle');
                const status = document.getElementById('vacationStatus');

                toggle.checked = data.enabled;
                status.textContent = data.enabled ? '✅ Reminders paused' : '🔔 Reminders active';
            } catch (error) {
                console.error('Failed to load vacation status:', error);
                document.getElementById('vacationStatus').textContent = '❌ Status unavailable';
            }
        }

        // Toggle vacation mode
        document.getElementById('vacationToggle').addEventListener('change', async function() {
            const status = document.getElementById('vacationStatus');
            status.textContent = '⏳ Updating...';

            try {
                await fetch('/vacation/toggle', { method: 'POST' });
                await loadVacationStatus();
            } catch (error) {
                console.error('Failed to toggle vacation mode:', error);
                status.textContent = '❌ Update failed';
                this.checked = !this.checked; // Revert toggle
            }
        });

        // Load initial status
        loadVacationStatus();
    </script>
</body>
</html>
